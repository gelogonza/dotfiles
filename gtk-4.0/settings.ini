[Settings]
# Adwaita is the BASE; gtk.css overrides its named colours. Setting some other
# theme here would just be ignored by libadwaita apps.
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=Geist 10
# The GTK tier is dark while the shell chrome is light — see render_gtk().
# GTK3 honours this; libadwaita ignores it and follows
# org.gnome.desktop.interface color-scheme instead, which is why the
# @define-color overrides in gtk.css are what actually darken Nautilus.
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=gelo-cursor
gtk-cursor-theme-size=24
