# hyprlock — lock screen.
#
# Intentionally plainer than the login screen. This is the security path back
# into a session that is already running, so it should feel instant: no shader,
# no elaborate entrance, nothing that can stall between you and your desktop.
# The shader budget is spent on the SDDM login theme instead.
#
# What it does keep from the design system: the glass material on the password
# field, the palette, the type, and the motion curve.

source = ~/.config/hypr/tokens.conf

general {
    hide_cursor = true
}

animations {
    enabled = true

    # Same expo-out curve as the rest of the system.
    bezier = ease, 0.16, 1.0, 0.3, 1.0

    animation = fadeIn, 1, $dur_fast, ease
    animation = fadeOut, 1, $dur_fast, ease
    animation = inputFieldDots, 1, 1, ease
}

# The desktop itself, blurred. Cheaper and less jarring than loading an image:
# you stay in the context you were already in.
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.008
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.16
}

# --- clock ---------------------------------------------------------------
label {
    monitor =
    text = $TIME
    font_family = $font_sans
    font_size = 84
    color = $text_1_rgba

    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font_sans
    font_size = $text_title
    color = $text_2_rgba

    position = 0, 150
    halign = center
    valign = center
}

# --- password field ------------------------------------------------------
# The one place the glass material appears on this screen.
input-field {
    monitor =
    size = 320, 48
    rounding = $glass_radius
    outline_thickness = 1

    # bg-1 at the glass opacity from the material spec. hyprlock takes 8-digit
    # hex; ae is 0.68 * 255.
    inner_color = rgba(16181dae)
    outer_color = $border_rgba

    # Success and failure both stay inside the palette. Failure reuses the
    # accent rather than introducing a red, which would be a fourth colour and
    # a fourth accent location.
    check_color = $border_rgba
    fail_color = rgba(d9775766)

    font_color = $text_1_rgba
    font_family = $font_mono

    placeholder_text =
    fail_text = $PAMFAIL

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}
