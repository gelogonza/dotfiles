# gelo — design-system integration for Hyprland
#
# Sourced at the END of hyprland.conf so these values win over the defaults above
# it. Everything here is either (a) a token consumed from tokens.conf or (b) the
# compositor-side half of an effect the shell cannot do alone.
#
# To back all of this out: delete the `source = ~/.config/hypr/gelo.conf` line
# from hyprland.conf. Nothing else in that file is modified.

source = ~/.config/hypr/tokens.conf

# ---------------------------------------------------------------------------
# Liquid-glass backdrop blur
# ---------------------------------------------------------------------------
# Qt cannot sample what is behind its own Wayland surface, so the "frosted"
# half of the glass material is done by the compositor blurring the layer.
# Each shell surface declares a namespace (WlrLayershell.namespace) that these
# rules match against.
#
# ignorealpha keeps the blur from bleeding through the fully transparent parts
# of the surface — without it the whole layer rectangle frosts, including the
# margins around the floating bar.

#
# Hyprland 0.56 uses the block rule syntax; the old
# `layerrule = blur, <ns>` one-liner is gone.

layerrule {
    name = gelo-bar-glass
    match:namespace = gelo-bar

    blur = true
    ignore_alpha = 0.1
}

layerrule {
    name = gelo-launcher-glass
    match:namespace = gelo-launcher

    blur = true
    ignore_alpha = 0.1
}

layerrule {
    name = gelo-notifications-glass
    match:namespace = gelo-notifications

    blur = true
    ignore_alpha = 0.1
}

decoration {
    # Tuned for the glass material: a wider, softer blur than the default reads
    # as frosted depth rather than as a smear.
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true

        # Very slight noise breaks up banding on the large flat translucent
        # surfaces. Too much and it reads as grain/texture, which is a different
        # material entirely.
        noise = 0.008
        contrast = 1.0
        brightness = 1.0
    }

    # Depth via shadow, not gradient.
    shadow {
        enabled = true
        range = $glass_blur
        render_power = 3
        color = rgba(0d0e1273)
    }
}

general {
    gaps_in = $space_xs
    gaps_out = $space_sm
    border_size = 1

    # ACCENT USE 2 of 3: focused window border.
    col.active_border = $accent_rgba
    col.inactive_border = $border_rgba
}

# ---------------------------------------------------------------------------
# Motion
# ---------------------------------------------------------------------------
# `bezier = ease, ...` is defined in tokens.conf from the same curve the shell
# and the login screen use, so window motion matches widget motion.

animations {
    enabled = true

    animation = windows,     1, $dur_base, ease, popin 96%
    animation = windowsOut,  1, $dur_fast, ease, popin 96%
    animation = border,      1, $dur_base, ease
    animation = fade,        1, $dur_fast, ease
    animation = workspaces,  1, $dur_base, ease, slidefade 12%
    animation = layers,      1, $dur_fast, ease, fade
}
