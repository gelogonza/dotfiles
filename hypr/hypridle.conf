# hypridle — idle timeline.
#
# Before this existed nothing ever locked the screen: there were two lock
# screens and no timer pointing at either one.
#
# This is a desktop, so there is no battery stage and no suspend. Two steps:
# lock, then turn the displays off.

general {
    # WHICH LOCK: hyprlock, deliberately, NOT the Quickshell lock on
    # SUPER+SHIFT+L. That one has never completed a real unlock cycle, and an
    # idle timer firing an untested lock while you are away from the keyboard is
    # precisely the scenario that strands you. Once it has let you back in a few
    # times (docs/lock-screen.md), change this one line to:
    #     quickshell -c gelo ipc call lock lock
    #
    # `pidof` guard: hypridle re-fires on repeated idle events, and without this
    # you end up with lock instances stacked on top of each other.
    # Routed through the script so the idle lock is the same lock as the
    # keybind, with the same fallback if the shell is not there.
    lock_cmd = ~/dotfiles/hypr/scripts/lock.sh

    # Lock before the machine suspends, so it never resumes to an open desktop.
    before_sleep_cmd = loginctl lock-session

    # Wake the displays on resume — without this you come back to a black screen
    # and have to guess whether the machine is on.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Honour `loginctl lock-session`, which is what the power menu, systemd and
    # anything else in the session use to request a lock.
    ignore_dbus_inhibit = false
}

# --- 5 minutes: lock -------------------------------------------------------
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# --- 10 minutes: displays off ----------------------------------------------
# Separate from the lock so the screen stays readable for a few minutes after
# locking — you can see the clock without touching anything.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
